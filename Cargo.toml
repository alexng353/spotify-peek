[package]
name = "spotify-peek"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.0"
# v4_12 for CssProvider::load_from_string; the box has GTK 4.22.
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.0"
serde_json = "1.0.151"
ureq = "3.3.0"
zbus = "5.18.0"

# This sits resident for the whole session, so trade build time for a small,
# fast binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
